# Decision-First Agentic Engine — full stack.
#
#   docker compose up -d --build     start everything (first run downloads models)
#   docker compose run --rm tui      open the terminal UI
#   ./dfae                           both of the above
#
# Everything optional degrades gracefully: without the GLiNER model the engine
# extracts with rules (COMPOSE_PROFILES=gliner adds the GLiNER service); decisions are made by the hosted Decisions API (openai/gpt-6-luna-decisions on Vercel AI Gateway, with the
# planner's key) and, if it cannot be reached, by built-in rules. A self-hosted decision model instead:
#   COMPOSE_PROFILES=local-decisions DECISION_BASE_URL=http://ollama:11434/v1 docker compose up -d
# (DECISION_PROVIDER=local: built-in rules only). Without
# the worker model it still runs every request that can be bound deterministically.

name: dfae

services:
  postgres:
    image: docker.arvancloud.ir/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dfae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfae}
      POSTGRES_DB: dfae
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfae -d dfae"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Entity extraction (GLiNER). The model downloads on first start.
  # Optional (COMPOSE_PROFILES=gliner, GLINER_URL=http://gliner:8000): on the harder end-to-end suite it made no measurable difference
  # (rules only 29/30, with GLiNER 28/30, same cost, +18% time), so requests are read with rules and the planner's own sentences.
  # Optional (COMPOSE_PROFILES=pii, DFAE_PII_NER_URL=http://gliner-pii:8000): a GLiNER PII model that takes person names and street
  # addresses out of what is kept for later (held-out set: 14/14 found, 0/12 lookalikes touched), off the request path.
  gliner-pii:
    build: ./services/gliner-service
    profiles: ["pii"]
    restart: unless-stopped
    environment:
      GLINER_MODEL: ${GLINER_PII_MODEL:-urchade/gliner_multi_pii-v1}
    volumes:
      - hf-models:/models

  gliner:
    build: ./services/gliner-service
    profiles: ["gliner"]
    restart: unless-stopped
    environment:
      GLINER_MODEL: ${GLINER_MODEL:-urchade/gliner_small-v2.1}
    volumes:
      - hf-models:/models

  # Model server for the decision model (self-hosted, OpenAI-compatible API). The planner and worker models are hosted.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-decisions"]
    restart: unless-stopped
    environment:
      # the decision model stays loaded; it asks a few questions at once
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "2"
      # Ollama's default context window (2-4k tokens) silently drops the start of a long prompt — the instructions. The decision
      # model is given the whole request, the conversation and every tool, so give it room.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pull the decision model into the ollama volume.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-decisions"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      DECISION_MODEL: ${DECISION_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$DECISION_PROVIDER" != "local" ]; then ollama pull "$$DECISION_MODEL"; fi

  # The engine: runtime + HTTP/SSE API.
  dfae:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: server
      args:
        # the Node.js in the sandbox: the newest LTS at build time, or an exact version (v24.22.3)
        NODE_VERSION: ${NODE_VERSION:-lts}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dfae:${POSTGRES_PASSWORD:-dfae}@postgres:5432/dfae
      GLINER_URL: ${GLINER_URL:-}
      DFAE_EMBEDDINGS: ${DFAE_EMBEDDINGS:-}
      DFAE_EMBEDDINGS_DIM: ${DFAE_EMBEDDINGS_DIM:-}
      DFAE_FACTS: ${DFAE_FACTS:-}
      DFAE_PII_NER_URL: ${DFAE_PII_NER_URL:-}
      DFAE_REDACT_PII: ${DFAE_REDACT_PII:-}
      DFAE_EMBEDDINGS_BASE_URL: ${DFAE_EMBEDDINGS_BASE_URL:-}
      DFAE_EMBEDDINGS_API_KEY: ${DFAE_EMBEDDINGS_API_KEY:-}
      DFAE_STEP_AGENT: ${DFAE_STEP_AGENT:-}
      DFAE_STEP_AGENT_STYLE: ${DFAE_STEP_AGENT_STYLE:-}
      DFAE_STEP_AGENT_TURNS: ${DFAE_STEP_AGENT_TURNS:-}
      DFAE_EXPOSED_CHANGES: ${DFAE_EXPOSED_CHANGES:-}
      DFAE_ROUTINES: ${DFAE_ROUTINES:-}
      DFAE_TIMEZONE: ${DFAE_TIMEZONE:-}
      DFAE_ROUTINE_CONCURRENCY: ${DFAE_ROUTINE_CONCURRENCY:-}
      DFAE_ROUTINE_MAX_RUNS_PER_DAY: ${DFAE_ROUTINE_MAX_RUNS_PER_DAY:-}
      # decision model: an open-weight model in the ollama service, answering typed questions through
      # token log-probabilities. DECISION_PROVIDER=local => built-in decision rules only.
      DECISION_BASE_URL: ${DECISION_BASE_URL:-}
      DECISION_MODEL: ${DECISION_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      DECISION_PROVIDER: ${DECISION_PROVIDER:-}
      DECISION_API_KEY: ${DECISION_API_KEY:-}
      DECISION_TIMEOUT_MS: ${DECISION_TIMEOUT_MS:-}
      DECISION_PARALLEL: ${DECISION_PARALLEL:-}
      DECISION_KINDS: ${DECISION_KINDS:-}
      DECISION_API_BASE_URL: ${DECISION_API_BASE_URL:-}
      DECISION_API_MODEL: ${DECISION_API_MODEL:-}
      DECISION_API_TIMEOUT_MS: ${DECISION_API_TIMEOUT_MS:-}
      # the planner model writes and revises plans; the worker model carries them out. Both are hosted and configured the same
      # way (provider: openai = any OpenAI-compatible endpoint | anthropic). Defaults: gpt-6-luna and glm-5.3-flash through
      # https://ai-gateway.vercel.sh/v1; an empty value means "use the default".
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-}
      PLANNER_API_KEY: ${PLANNER_API_KEY:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      PLANNER_BASE_URL: ${PLANNER_BASE_URL:-}
      PLANNER_MAX_TOKENS: ${PLANNER_MAX_TOKENS:-}
      PLANNER_TIMEOUT_SECS: ${PLANNER_TIMEOUT_SECS:-}
      PLANNER_PROMPT_CACHE: ${PLANNER_PROMPT_CACHE:-}
      PLANNER_REASONING: ${PLANNER_REASONING:-}
      PLANNER_REASONING_HARD: ${PLANNER_REASONING_HARD:-}
      PLANNER_REASONING_ADAPTIVE: ${PLANNER_REASONING_ADAPTIVE:-}
      PLANNER_CACHE_TTL_SECS: ${PLANNER_CACHE_TTL_SECS:-}
      WORKER_PROVIDER: ${WORKER_PROVIDER:-}
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      WORKER_MODEL: ${WORKER_MODEL:-}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-}
      WORKER_MAX_TOKENS: ${WORKER_MAX_TOKENS:-}
      WORKER_CONTENT_MAX_TOKENS: ${WORKER_CONTENT_MAX_TOKENS:-}
      WORKER_TIMEOUT_SECS: ${WORKER_TIMEOUT_SECS:-}
      WORKER_REASONING: ${WORKER_REASONING:-}
      WORKER_PROVIDERS: ${WORKER_PROVIDERS:-}
      # web search backends (optional; without them DuckDuckGo's HTML endpoint and Wikipedia are used)
      SEARXNG_URL: ${SEARXNG_URL:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # MCP: with a Glama key the agent finds, connects and uses MCP servers from the Glama directory when a request needs one
      GLAMA_API_KEY: ${GLAMA_API_KEY:-}
      GLAMA_BASE_URL: ${GLAMA_BASE_URL:-}
      DFAE_MCP_AUTO: ${DFAE_MCP_AUTO:-}
      DFAE_MCP_MAX_AUTO: ${DFAE_MCP_MAX_AUTO:-}
      DFAE_MCP_TIMEOUT_SECS: ${DFAE_MCP_TIMEOUT_SECS:-}
      DFAE_API_TOKEN: ${DFAE_API_TOKEN:-}
      DFAE_ALLOW_AUTO_APPROVE: ${DFAE_ALLOW_AUTO_APPROVE:-false}
      # never (default): no tool call waits for a human. ask: risky calls wait for approval in the TUI.
      DFAE_APPROVALS: ${DFAE_APPROVALS:-never}
      # complexity (0..1) at which the built-in rules (the fallback when the decision model is down) say a request needs a plan
      DFAE_PLAN_MIN_COMPLEXITY: ${DFAE_PLAN_MIN_COMPLEXITY:-}
      DFAE_MAX_MODEL_CALLS: ${DFAE_MAX_MODEL_CALLS:-}
      DFAE_MAX_REPLANS: ${DFAE_MAX_REPLANS:-}
      DFAE_MAX_STEPS: ${DFAE_MAX_STEPS:-}
      DFAE_MAX_TOOL_CALLS: ${DFAE_MAX_TOOL_CALLS:-}
      DFAE_MAX_SECONDS: ${DFAE_MAX_SECONDS:-}
      DFAE_MAX_WORKER_CALLS: ${DFAE_MAX_WORKER_CALLS:-}
      DFAE_REPAIR: ${DFAE_REPAIR:-}
      DFAE_LAZY_CONTEXT: ${DFAE_LAZY_CONTEXT:-}
      DFAE_PLAN_FALLBACK: ${DFAE_PLAN_FALLBACK:-}
      DFAE_PLAN_PREFIX: ${DFAE_PLAN_PREFIX:-}
      DFAE_PLAN_REPORT: ${DFAE_PLAN_REPORT:-}
      DFAE_ANSWER_LOCAL_FIRST: ${DFAE_ANSWER_LOCAL_FIRST:-}
      DFAE_WORKSPACE_SNAPSHOT: ${DFAE_WORKSPACE_SNAPSHOT:-}
      DFAE_CONDENSE: ${DFAE_CONDENSE:-}
      DFAE_DECISION_LOG: ${DFAE_DECISION_LOG:-}
      DFAE_SHADOW_EVAL: ${DFAE_SHADOW_EVAL:-}
      DFAE_TEAM: ${DFAE_TEAM:-}
      DFAE_MAX_CONCURRENT_TASKS: ${DFAE_MAX_CONCURRENT_TASKS:-}
      DFAE_MAX_AGENTS: ${DFAE_MAX_AGENTS:-}
      DFAE_ROLE_SLOTS: ${DFAE_ROLE_SLOTS:-}
      RUST_LOG: ${RUST_LOG:-info,tower_http=warn}
    volumes:
      - workspace:/workspace
    # Published on loopback only: the API can run tools. Set DFAE_API_TOKEN
    # before exposing it any further.
    ports:
      - "127.0.0.1:${DFAE_PORT:-8080}:8080"
      # what the agent serves (a web page, an app): it must listen on 0.0.0.0 in this range to be reachable from the host
      - "127.0.0.1:8000-8010:8000-8010"
    # tools run inside this container as an unprivileged user
    read_only: true
    mem_limit: ${DFAE_MEM_LIMIT:-2g}
    pids_limit: 512
    tmpfs:
      # scratch space for the shell: HOME, build and package caches (exec, because compilers and scripts run from here)
      - /tmp:exec,size=1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Terminal UI. Not started by `up`; run it with `docker compose run --rm tui`.
  tui:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: tui
    profiles: ["tui"]
    depends_on:
      dfae:
        condition: service_healthy
    environment:
      DFAE_URL: http://dfae:8080
      DFAE_API_TOKEN: ${DFAE_API_TOKEN:-}
    stdin_open: true
    tty: true

volumes:
  pgdata:
  ollama:
  hf-models:
  workspace:
