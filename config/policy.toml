# DFAE policy — the deterministic security boundary.
#
# Neither the decision model nor the language model can override this file.
# It is evaluated when a plan is validated AND again, on the final
# arguments, immediately before each tool runs.
#
# `{workspace}` expands to the engine's workspace directory.

[filesystem]
read_roots = ["{workspace}"]
write_roots = ["{workspace}"]
write_requires_approval = true
# path components that are never touched, wherever they appear
deny_names = [".git", ".env", "id_rsa", "id_ed25519", ".ssh", ".aws"]

[shell]
# "sandbox": the shell tool is a full bash in the workspace (pipes, redirects, &&, git, build and test
#   tools; background jobs). The container is the boundary — read-only root filesystem, no capabilities,
#   unprivileged user, memory and process limits — so use this ONLY inside it.
# "allowlist": one allowlisted command, no shell (for a machine that matters): the lists below apply.
mode = "sandbox"
# longest timeout_secs a command may ask for
max_timeout_secs = 900
# (allowlist mode only) executed without a shell (no pipes, redirects, globbing or substitution)
allowed = ["ls", "cat", "head", "tail", "wc", "grep", "find", "echo", "date", "uname", "df", "free", "uptime", "ps", "pwd", "whoami", "hostname", "stat", "du", "sort", "diff", "cut", "tr", "basename", "dirname", "nproc", "id"]
# run only after a human approves the exact command
approval = ["mkdir", "touch", "cp", "mv"]
# commands whose path-like arguments must stay inside the read roots
path_checked = ["cat", "head", "tail", "wc", "grep", "find", "ls", "stat", "du", "sort", "diff", "cut", "tr"]
timeout_secs = 10
max_output_bytes = 65536

# per-command arguments that would make a read-only command write or execute
[shell.denied_args]
find = ["-exec", "-execdir", "-ok", "-okdir", "-delete", "-fprint", "-fprint0", "-fprintf", "-fls"]
sort = ["-o", "--output"]
date = ["-s", "--set"]

[network]
# fetched without approval. "*.example.com" matches subdomains.
allowed_domains = [
  "example.com", "example.org", "*.wikipedia.org", "github.com", "*.github.com",
  "raw.githubusercontent.com", "docs.rs", "crates.io", "nvd.nist.gov",
  "*.postgresql.org", "httpbin.org", "*.python.org", "*.rust-lang.org",
]
# Read-only GETs to any public host run without approval, so the agent can use the
# open web (search results, pages, APIs). Private, loopback and link-local addresses
# are always blocked, and once a tool output looks like a prompt injection unlisted
# hosts need approval again (a URL can carry data out). Set false to restrict the
# agent to the list above.
open_web = true
# with open_web = false: public hosts that are not listed need approval (false = denied).
unlisted_requires_approval = true
max_response_bytes = 262144
timeout_secs = 15
